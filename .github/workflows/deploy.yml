name: Deploy

# Only the default branch deploys. Pull requests are handled by ci.yml and have
# no access to the deploy secrets.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      operation:
        description: What to do
        type: choice
        options: [deploy, rollback, list]
        default: deploy
      version:
        description: Release to activate (rollback only; blank = previous release)
        type: string
        required: false

permissions:
  contents: read

# Never let two deploys interleave, and never cancel one midway.
concurrency:
  group: deploy-nav-emoera-com
  cancel-in-progress: false

env:
  DEPLOY_SITE: nav.emoera.com
  # The origin serves plain HTTP; TLS for visitors is terminated at EdgeOne.
  DEPLOY_VERIFY_HOST: nav.emoera.com
  DEPLOY_VERIFY_SCHEME: http

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.inputs.operation == 'deploy'
    name: build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Publish release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_DIST: dist
        run: |
          version="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}"
          echo "release=$version" >>"$GITHUB_STEP_SUMMARY"
          bash scripts/deploy-release.sh publish "$version"

      - name: Show releases on origin
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash scripts/deploy-release.sh list

  rollback:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'rollback'
    name: roll back
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Roll back
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash scripts/deploy-release.sh rollback "${{ github.event.inputs.version }}"

  list:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'list'
    name: list releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: List
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash scripts/deploy-release.sh list
